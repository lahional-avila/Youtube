<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube App</title>
    <!-- Configuración para que Windows lo trate como App -->
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        /* Estilos Modo Oscuro */
        body {
            background-color: #0f0f0f; /* Fondo Negro YouTube */
            color: #ffffff;
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .app-container {
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: -2px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo span {
            background-color: #ff0000;
            color: white;
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 2rem;
        }

        .search-wrapper {
            background-color: #1e1e1e;
            border: 1px solid #303030;
            border-radius: 40px;
            padding: 5px;
            display: flex;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            padding: 15px 25px;
            font-size: 18px;
            outline: none;
        }

        button {
            background-color: #272727;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #3f3f3f;
        }

        .footer {
            margin-top: 50px;
            color: #555;
            font-size: 12px;
        }

        .hint {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo">
            <span>▶</span> YouTube
        </div>

        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Buscar en YouTube..." autofocus>
            <button onclick="buscar()">Buscar</button>
        </div>

        <p class="hint">Presiona Enter para buscar</p>

        <div class="footer">
            © 2026 Lahional Ávila — +56 9 8895 0587
        </div>
    </div>

    <script>
        function buscar() {
            const query = document.getElementById('searchInput').value;
            if (query.trim() !== "") {
                // Abre los resultados en una nueva pestaña/ventana
                window.location.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
            }
        }

        // Permitir buscar con la tecla Enter
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                buscar();
            }
        });
    </script>
</body>
</html>
