<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Search</title>
    
    <!-- Enlace al manifiesto para instalación -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Colores para modo app en móviles y Windows -->
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Roboto', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: -1.5px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logo-icon {
            background: #ff0000;
            color: white;
            width: 45px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .search-box {
            display: flex;
            background: #121212;
            border: 1px solid #303030;
            border-radius: 40px;
            padding: 5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 15px 25px;
            font-size: 18px;
            outline: none;
        }

        button {
            background: #272727;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
        }

        button:hover { background: #3f3f3f; }

        .footer {
            margin-top: 50px;
            color: #555;
            font-size: 12px;
        }

        .install-hint {
            margin-top: 20px;
            color: #aaa;
            font-size: 13px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <div class="logo-icon">▶</div>
            YouTube
        </div>

        <div class="search-box">
            <input type="text" id="q" placeholder="Buscar en YouTube..." autofocus>
            <button onclick="buscar()">Buscar</button>
        </div>

        <p class="install-hint">Presiona Enter para buscar</p>

        <div class="footer">
            © 2026 Lahional Ávila — +56 9 8895 0587
        </div>
    </div>

    <script>
        function buscar() {
            const q = document.getElementById('q').value.trim();
            if (!q) return;

            // Detecta si es Android para intentar abrir la app nativa
            const isAndroid = /Android/i.test(navigator.userAgent);
            
            if (isAndroid) {
                // Fuerza apertura en app de YouTube
                window.location.href = `vnd.youtube://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;
            } else {
                // En Windows abre la web normal (Brave/Chrome/Edge)
                window.location.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;
            }
        }

        // Buscar con Enter
        document.getElementById('q').addEventListener('keypress', e => {
            if (e.key === 'Enter') buscar();
        });
    </script>
</body>
</html>
